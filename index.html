<style>
  :root{

  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;padding:18px;}
  .wrap{max-width:860px;margin:0 auto;}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .title{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .badge{font-size:12px;color:var(--brand);background:var(--brand-soft);padding:3px 10px;border-radius:999px;font-weight:600;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  .lessonbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .lessonbar select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-family:inherit;background:#fff;max-width:260px;cursor:pointer;}
  .lessonbar .progress{font-size:12px;color:var(--sub);margin-left:auto;}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:8px 13px;border-radius:10px;font-size:13px;font-weight:600;transition:.15s;}
  button:hover{border-color:var(--brand);color:var(--brand);}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand);}
  button.primary:hover{background:#1d4ed8;color:#fff;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .card h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px;}
  .meta{color:var(--sub);font-size:13px;margin-bottom:10px;}
  .video-box{position:relative;width:100%;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;}
  .video-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .lesson-note{margin-top:10px;font-size:14px;background:var(--brand-soft);color:#1e40af;padding:10px 12px;border-radius:10px;}
  .tip{margin-top:8px;font-size:13px;background:#fff7e6;color:#8a5a00;border:1px solid #ffe0a3;padding:8px 12px;border-radius:10px;}
  .task{margin-top:8px;font-size:13px;color:var(--sub);}
  ol.vocab{margin:0;padding-left:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;}
  ol.vocab li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;}
  .w{font-weight:700;}
  .ph{color:var(--brand);font-size:13px;}
  .pos{color:var(--sub);font-size:12px;margin:0 4px;}
  .m{color:var(--ink);}
  .hide .m{visibility:hidden;}
  .unit{font-size:13px;color:var(--brand);font-weight:700;margin-bottom:6px;}
  .gram-img{width:100%;border-radius:10px;border:1px solid var(--line);cursor:pointer;}
  .gram-img:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .speech-topic{font-size:16px;font-weight:700;margin:6px 0 8px;}
  .durations{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .timer{margin-top:14px;text-align:center;}
  .timer .status{font-size:18px;font-weight:800;min-height:28px;}
  .timer .big{font-size:46px;font-weight:900;letter-spacing:2px;margin:6px 0;font-variant-numeric:tabular-nums;}
  .timer .log{font-size:14px;color:var(--amber);min-height:22px;font-weight:600;}
  .logbox{margin-top:10px;font-size:13px;color:var(--sub);text-align:left;max-height:160px;overflow:auto;
    background:#f9fafb;border-radius:10px;padding:10px;display:none;}
  .logbox.show{display:block;}
  .logbox div{padding:2px 0;border-bottom:1px dotted var(--line);}
  .replay{display:none;margin-top:10px;}
  @media(max-width:640px){ol.vocab{grid-template-columns:1fr;}}
  footer{text-align:center;color:var(--sub);font-size:12px;margin:10px 0 30px;}

  /* 登录遮罩 */
  #loginOverlay{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a8a,#2563eb);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
  #loginOverlay.hidden{display:none;}
  .login-card{background:#fff;border-radius:18px;padding:28px 26px;width:100%;max-width:360px;box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .login-card h1{margin:0 0 4px;font-size:20px;}
  .login-card .sub{color:var(--sub);font-size:13px;margin-bottom:6px;}
  .login-card label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;}
  .login-card input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;box-sizing:border-box;}
  .login-card input:focus{outline:none;border-color:var(--brand);}
  .login-card .err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px;font-weight:600;}
  .login-card .login-btn{width:100%;margin-top:14px;padding:12px;font-size:15px;}
  .login-card .note{margin-top:14px;font-size:12px;color:var(--sub);line-height:1.5;}
</style>

const MAX_DEVICES = 5;

function getDeviceId(){
  let d = localStorage.getItem('nce2_device');
  if(!d){
    d = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
    localStorage.setItem('nce2_device', d);
  }
  return d;
}
function isLoggedIn(){
  const u = localStorage.getItem('nce2_user');
  return !!u && ACCOUNTS[u] !== undefined;
}
/* 设备上限登记：纯静态站点无法跨设备统计，这里做本浏览器本地登记，
   用于接入后端时平滑过渡；真正的“5 台设备上限”需后端持久化计数。 */
function registerDevice(username){
  try{
    let map = JSON.parse(localStorage.getItem('nce2_devmap')||'{}');
    const did = getDeviceId();
    let list = map[username] ? map[username].slice() : [];
    if(!list.includes(did)) list.push(did);
    map[username] = list;
    localStorage.setItem('nce2_devmap', JSON.stringify(map));
    return list.length <= MAX_DEVICES;
  }catch(e){ return true; }
}
function tryLogin(rawU, rawP){
  const u = (rawU||'').trim().toLowerCase();
  const p = rawP||'';
  if(!u || !p) return {ok:false, msg:'请输入用户名和密码'};
  if(ACCOUNTS[u] === undefined) return {ok:false, msg:'用户名不存在'};
  if(ACCOUNTS[u] !== p) return {ok:false, msg:'密码错误'};
  if(!registerDevice(u)) return {ok:false, msg:'该账号已达 5 台设备上限，已停用'};
  localStorage.setItem('nce2_user', u);
  return {ok:true};
}
function showLogin(){
  const ov = document.getElementById('loginOverlay');
  if(ov) ov.classList.remove('hidden');
  const lo = document.getElementById('btnLogout');
  if(lo) lo.style.display='none';
  const lu = document.getElementById('lu'); if(lu) lu.focus();
}
function setupApp(){
  const ov = document.getElementById('loginOverlay');
  if(ov) ov.classList.add('hidden');
  const lo = document.getElementById('btnLogout');
  if(lo) lo.style.display='';
  const sel = document.getElementById('lessonSelect');
  if(sel && sel.options.length===0){
    for(let i=1;i<=96;i++){
      const o=document.createElement('option');
      o.value=i; o.textContent="第 "+i+" 课 · "+(NCE2[i-1].title);
      sel.appendChild(o);
    }
  }
  loadLesson();
  buildState();
  render();
}

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const u=document.getElementById('lu').value;
  const p=document.getElementById('lp').value;
  const r=tryLogin(u,p);
  if(!r.ok){ document.getElementById('loginErr').textContent=r.msg; return; }
  document.getElementById('loginErr').textContent='';
  document.getElementById('lp').value='';
  setupApp();
});
document.getElementById('btnLogout').addEventListener('click', function(){
  localStorage.removeItem('nce2_user');
  showLogin();
});

/* ===================== 状态 ===================== */
let state = null;
let timerIv = null, readyIv = null;

function dayNumber(){ return Math.floor(Date.now()/86400000); }
function todayStr(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}

let currentLesson = 1;
function loadLesson(){
  const saved = parseInt(localStorage.getItem('nce2_lesson')||'1',10);
  currentLesson = (isNaN(saved)||saved<1||saved>96) ? 1 : saved;
}
function buildState(lessonNo){
  if(lessonNo!==undefined){
    currentLesson = ((lessonNo-1+96)%96)+1;
  }
  const idx = currentLesson-1;
  state = {
    date: todayStr(),
    dayIndex: idx,
    lessonNo: currentLesson,
    nce: NCE2[idx],
    vocabulary: VOCAB[idx % VOCAB.length],
    speechIdx: idx % SPEECH.length,
    enc: ENCY_FLAT[idx % ENCY_FLAT.length],
    speech: SPEECH[idx % SPEECH.length]
  };
  try{ localStorage.setItem('nce2_lesson', String(currentLesson)); }catch(e){}
}

function openBilibili(bvid, page){ window.open("https://www.bilibili.com/video/"+bvid+(page?("?p="+page):""),"_blank","noopener"); }
function openImage(src){ window.open(src,"_blank","noopener"); }

function render(){
  if(!state) buildState();
  const s = state;
  const unitNum = String(s.dayIndex+1).padStart(2,'0');
  const gramSrc = "assets/grammar/unit_"+unitNum+".jpg";
  const videoSrc = "https://player.bilibili.com/player.html?bvid="+s.nce.bvid+"&page="+s.nce.page+"&high_quality=1&danmaku=0";
  const enc = s.enc;
  const encSrc = "https://player.bilibili.com/player.html?bvid="+enc.bvid+"&page="+enc.page+"&high_quality=1&danmaku=0";
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="card">
    <h2>🎬 新概念英语第二册 · 第 ${s.nce.lesson} 课</h2>
    <div class="lesson-note">📺 ${s.nce.title}</div>
    <div class="video-box"><iframe src="${videoSrc}" referrerpolicy="no-referrer" allowfullscreen scrolling="no"></iframe></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 4px">
      <button onclick="openBilibili('${s.nce.bvid}', ${s.nce.page})">🔗 在哔哩哔哩打开第 ${s.nce.lesson} 课</button>
    </div>
    <div class="tip">💡 若上方视频加载失败，点击按钮即可在哔哩哔哩稳定观看本课。</div>
    <div class="task">观看任务：先盲听一遍 → 打开英文字幕跟读 → 摘抄 2 句你喜欢的表达。</div>
  </div>

  <div class="card">
    <h2>📖 视频生词 <span style="font-size:12px;font-weight:500;color:var(--sub)">（共 ${s.vocabulary.length} 个）</span></h2>
    <div style="margin-bottom:10px"><button id="btnDictation">🔊 生词听写</button> <button id="btnShowMean">显示释义</button></div>
    <ol class="vocab" id="vocabList">
      ${s.vocabulary.map((v,i)=>`<li><span class="w">${i+1}. ${v[0]}</span> <span class="ph">${v[1]}</span> <span class="pos">${v[2]}</span> <span class="m">${v[3]}</span></li>`).join('')}
    </ol>
  </div>

  <div class="card grammar">
    <h2>📚 本课语法点（English Grammar in Use）</h2>
    <div class="unit">Unit ${s.dayIndex+1}</div>
    <div class="tip">👇 点击可放大查看原图</div>
    <img class="gram-img" src="${gramSrc}" alt="Unit ${s.dayIndex+1}" onclick="openImage('${gramSrc}')" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
    <div style="display:none;color:var(--red);font-size:14px;">⚠️ 语法截图未找到：assets/grammar/unit_${unitNum}.jpg</div>
  </div>

  <div class="card ency">
    <h2>🌍 英语百科（课外拓展）</h2>
    <div class="lesson-note">📺 本课推荐：${enc.title}（第 ${enc.page} / ${enc.total} 集）</div>
    <div class="lesson-note">🎧 本集：${enc.epTitle}</div>
    <div class="tip">${enc.desc}</div>
    <div class="video-box"><iframe src="${encSrc}" referrerpolicy="no-referrer" allowfullscreen scrolling="no"></iframe></div>
    <div style="margin-top:8px"><button onclick="openBilibili('${enc.bvid}', ${enc.page})">🔗 在哔哩哔哩打开本集</button></div>
  </div>

  <div class="card">
    <h2>🎤 今日即兴演讲题目</h2>
    <div class="speech-topic">${s.speech}</div>
    <div class="tip">💡 演讲小提示：开头引入 + 2 个论点 + 简短结尾，不用写完整稿子，列关键词即可。</div>
    <div class="durations">
      <button data-min="1">开始 1 分钟倒计时</button>
      <button data-min="2">开始 2 分钟倒计时</button>
      <button data-min="3">开始 3 分钟倒计时</button>
      <button id="btnNewTopic">🔄 换演讲题目</button>
    </div>
    <div class="timer">
      <div class="status" id="timerStatus"></div>
      <div class="big" id="timerBig">--:--</div>
      <div class="log" id="timerLog"></div>
      <div class="logbox" id="timerLogBox"></div>
      <button class="replay" id="btnStopTimer">停止计时</button>
    </div>
  </div>
  `;
  document.getElementById('diffBadge').textContent = "第 "+s.lessonNo+" 课 / 96";
  const sel=document.getElementById('lessonSelect'); if(sel) sel.value = s.lessonNo;
  const pt=document.getElementById('progressText'); if(pt) pt.textContent = "已学至第 "+s.lessonNo+" 课 / 共 96 课";
  bindEvents();
}

function bindEvents(){
  document.getElementById('btnDictation').onclick = ()=>{
    document.getElementById('vocabList').classList.add('hide');
    document.getElementById('btnShowMean').style.display='';
  };
  document.getElementById('btnShowMean').onclick = ()=>{
    document.getElementById('vocabList').classList.remove('hide');
  };
  document.getElementById('btnNewTopic').onclick = ()=>{
    state.speechIdx = (state.speechIdx+1) % SPEECH.length;
    state.speech = SPEECH[state.speechIdx];
    render();
  };
  document.querySelectorAll('.durations button[data-min]').forEach(b=>{
    b.onclick = ()=> startCountdown(parseInt(b.dataset.min,10));
  });
  document.getElementById('btnStopTimer').onclick = stopTimer;
}

/* ===================== 倒计时 ===================== */
function fmt(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');
}
function startCountdown(min){
  stopTimer();
  const total = min*60;
  let remaining = total;
  const milestones = {
    1:[[30,"🟡 还有 30 秒，尽快收尾总结！"],[10,"🟠 还有 10 秒，准备结束你的观点！"],[0,"⏰ 时间结束！演讲完成，可以复盘自己的表达。"]],
    2:[[60,"🟡 还有 1 分钟，把控结尾！"],[30,"🟠 还有 30 秒，尽快收尾总结！"],[0,"⏰ 时间结束！演讲完成，可以复盘自己的表达。"]],
    3:[[120,"🟢 还有 2 分钟，注意节奏，展开你的 2 个论点。"],[60,"🟡 还有 1 分钟，把控结尾！"],[30,"🟠 还有 30 秒，尽快收尾总结！"],[10,"🔴 还有 10 秒，准备结束你的观点！"],[0,"⏰ 时间结束！演讲完成，可以复盘自己的表达。"]]
  }[min];
  const statusEl=document.getElementById('timerStatus');
  const bigEl=document.getElementById('timerBig');
  const logEl=document.getElementById('timerLog');
  const boxEl=document.getElementById('timerLogBox');
  const stopBtn=document.getElementById('btnStopTimer');
  boxEl.classList.remove('show'); boxEl.innerHTML='';
  stopBtn.style.display='inline-block';
  let mi=0;
  let r=3;
  statusEl.textContent='准备：'+r;
  bigEl.textContent=fmt(remaining);
  logEl.textContent='';
  readyIv=setInterval(()=>{
    r--;
    if(r>0){ statusEl.textContent='准备：'+r; }
    else{
      clearInterval(readyIv); readyIv=null;
      statusEl.textContent='→ 开始演讲！';
      timerIv=setInterval(()=>{
        remaining--;
        bigEl.textContent=fmt(Math.max(remaining,0));
        while(mi<milestones.length && milestones[mi][0]===remaining){
          const msg=milestones[mi][1];
          logEl.textContent=msg;
          const d=document.createElement('div'); d.textContent='【时间提醒】'+msg; boxEl.appendChild(d);
          mi++;
        }
        if(remaining<=0){ bigEl.textContent='00:00'; stopTimer(); }
      },1000);
    }
  },1000);
}
function stopTimer(){
  if(timerIv){clearInterval(timerIv);timerIv=null;}
  if(readyIv){clearInterval(readyIv);readyIv=null;}
  const stopBtn=document.getElementById('btnStopTimer');
  if(stopBtn) stopBtn.style.display='none';
  const box=document.getElementById('timerLogBox');
  if(box) box.classList.add('show');
}

/* ===================== 顶部按钮 ===================== */
function gotoLesson(n){ buildState(n); render(); window.scrollTo({top:0,behavior:'smooth'}); }

document.getElementById('btnPrev').onclick = ()=> gotoLesson(currentLesson-1);
document.getElementById('btnNext').onclick = ()=> gotoLesson(currentLesson+1);
document.getElementById('btnHome').onclick = ()=> gotoLesson(1);
document.getElementById('lessonSelect').onchange = (e)=> gotoLesson(parseInt(e.target.value,10));
document.getElementById('btnReplay').onclick = ()=>{
  if(!state) buildState();
  const s=state;
  const lines=[];
  lines.push("【Cathy's 英语每日打卡 · 复盘】");
  lines.push("📅 日期："+s.date+"　进度：第 "+s.lessonNo+" / 96 课");
  lines.push("\n🎬 新概念二 第"+s.nce.lesson+"课："+s.nce.title);
  lines.push("\n📖 生词：");
  s.vocabulary.forEach((v,i)=>lines.push((i+1)+". "+v[0]+" "+v[1]+" "+v[2]+" "+v[3]));
  lines.push("\n📚 语法：Unit "+s.lessonNo+"（见页面截图）");
  lines.push("\n🌍 英语百科："+s.enc.title+" 第 "+s.enc.page+" / "+s.enc.total+" 集 · "+s.enc.epTitle);
  lines.push("\n🎤 演讲题："+s.speech);
  alert(lines.join("\n"));
};

(function init(){
  if(isLoggedIn()){ setupApp(); }
  else { showLogin(); }
})();
</script>
